name: Sweep watched orgs

# Ask every organisation in data/watched-orgs-map.json what it has published,
# on both GitHub and Hugging Face.
#
# The two harvests find things by popularity — fifty stars, a hundred monthly
# downloads — and both are trailing signals. Anything published recently is
# invisible, and anything that never sets a topic tag stays invisible for good.
# That is how huggingface/lerobot (27,960 stars) and TheRobotStudio/SO-ARM100
# (6,800 stars, the arm behind 64 of the datasets we index) ended up outside an
# index that already tracks their hardware.
#
# This asks the opposite question: not "what is popular" but "what have these
# named organisations published". One call each, no floor, no topic required, so
# a release appears the day it is made.
#
# It also verifies the handles. Most of the map was written from memory and has
# never been confirmed; a handle that does not exist returns nothing, so the
# sweep settles them as a side effect and prints the ones to correct.
#
# About 190 calls, well inside GitHub's 5,000/hour.

on:
  schedule:
    - cron: "0 10 * * 4"      # Thursdays, after the other three harvests
  workflow_dispatch:
    inputs:
      since:
        description: "Only items created on or after this date (blank = last 180 days)"
        default: ""
      verify_only:
        description: "Only check which handles exist; no listing, no output"
        type: boolean
        default: false
      no_robotics_filter:
        description: "Keep everything a watched account published, including unrelated work"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sweep-orgs
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set date
        run: echo "STAMP=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Sweep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p data/history
          python scripts/sweep_orgs.py \
            ${{ github.event.inputs.since && format('--since {0}', github.event.inputs.since) || '' }} \
            ${{ github.event.inputs.verify_only == 'true' && '--verify-only' || '' }} \
            ${{ github.event.inputs.no_robotics_filter == 'true' && '--no-robotics-filter' || '' }} \
            --out "data/history/sweep-${STAMP}.csv" \
            --summary-out "data/history/sweep-orgs-${STAMP}.csv" \
            | tee /tmp/sweep.log

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history/
          if git diff --staged --quiet; then
            echo "Nothing new."
          else
            git commit -m "Org sweep ${STAMP}"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ env.STAMP }}
          path: |
            data/history/sweep-${{ env.STAMP }}.csv
            data/history/sweep-orgs-${{ env.STAMP }}.csv
            /tmp/sweep.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## What the watched organisations have published"
            echo '```'; cat /tmp/sweep.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
