name: Draft sourcing notes

# Manual only. Drafts a sourcing note and verifiedOn date for every
# models-data entry, and prints every case where the recorded licence
# disagrees with what the repo actually says.
#
# Writes nothing to data/ by default — the output is an artifact you download
# and review. Set commit=true only once you've read the discrepancy report and
# are happy with the drafted notes.
#
# GITHUB_TOKEN is injected automatically, which raises the API limit from 60
# requests/hour to 5,000. The job needs about 70.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Write the drafted notes back to data/models-data.json"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draft notes and report discrepancies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/draft_sourcing.py \
            --in data/models-data.json \
            --out /tmp/models-data.drafted.json \
            | tee /tmp/report.txt

      - name: Upload for review
        uses: actions/upload-artifact@v4
        with:
          name: sourcing-draft
          path: |
            /tmp/models-data.drafted.json
            /tmp/report.txt

      - name: Show the report in the run summary
        run: |
          {
            echo '## Licence discrepancy report'
            echo '```'
            cat /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, only if asked
        if: ${{ inputs.commit }}
        run: |
          cp /tmp/models-data.drafted.json data/models-data.json
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain data/models-data.json | grep -q .; then
            git add data/models-data.json
            git commit -m "Draft sourcing notes for models-data entries"
            git push
          else
            echo "No change."
          fi
