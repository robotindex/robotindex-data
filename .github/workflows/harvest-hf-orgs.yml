name: Harvest HF orgs

# Weekly sweep of every Hugging Face publisher we watch, listing what they have
# uploaded recently regardless of downloads.
#
# The main harvest in harvest-sources.yml sorts the robotics tag by downloads
# and walks down until it hits the floor. That is structurally late: a dataset
# published last week has had no time to accumulate 100 downloads and cannot be
# reached by a download-ordered walk however significant it is.
#
# Reading two years of robotics papers found 49 datasets that harvest had never
# seen. 32 were live, and 28 of those were already above the 100 floor — they
# qualified under the existing rule and were simply never reached. This closes
# the same gap from the publisher side, the way harvest-orgs.yml does for
# GitHub.
#
# Output is only what is NOT already in data/history, so this is a short review
# list rather than another census.

on:
  schedule:
    - cron: "30 8 * * 2"       # Tuesdays, just after the GitHub org sweep
  workflow_dispatch:
    inputs:
      since:
        description: "Only datasets created on or after this date (blank = last 90 days)"
        default: ""
      derive:
        description: "Regenerate the watch list from the latest harvest first"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: harvest-hf-orgs
  cancel-in-progress: false

jobs:
  hforgs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set date
        run: echo "STAMP=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Regenerate the watch list
        if: ${{ github.event.inputs.derive == 'true' }}
        run: |
          LATEST=$(ls -1 data/history/hf-*.csv | tail -1)
          echo "deriving from $LATEST"
          python scripts/harvest_hf_orgs.py --derive "$LATEST"

      - name: Sweep
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p data/history
          python scripts/harvest_hf_orgs.py \
            ${{ github.event.inputs.since && format('--since {0}', github.event.inputs.since) || '' }} \
            --out "data/history/hf-orgs-${STAMP}.csv" \
            | tee /tmp/hforgs.log

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history/ data/watched-hf-orgs.json
          if git diff --staged --quiet; then
            echo "Nothing new."
          else
            git commit -m "HF org sweep ${STAMP}"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-orgs-${{ env.STAMP }}
          path: |
            data/history/hf-orgs-${{ env.STAMP }}.csv
            /tmp/hforgs.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## New from watched Hugging Face publishers"
            echo '```'; cat /tmp/hforgs.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
