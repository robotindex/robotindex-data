name: Harvest GitHub

# A full pass over robotics repositories on GitHub.
#
# Separate from harvest-sources.yml because it takes around two hours: the
# search API caps a query at 1,000 results and allows 30 requests a minute, so
# 78 topics plus 7 qualified pairs are each split into calendar-quarter slices
# of creation date back to 2015, plus one extra pass over the last 90 days at a
# lower star floor — 4,165 queries, paced to stay under the limit, then a README
# fetch per surviving repo to resolve embodiment.
#
# The recent pass exists because a repository published last week has had no
# time to earn 50 stars. Pantheon's Argus annotator, released two days before
# the first run and already auditing nine of the largest robotics datasets, was
# invisible to the main pass for exactly that reason.
#
# Monthly rather than weekly for the same reason. Repo stars and commit dates
# move slowly enough that a month is a reasonable sampling interval, and the
# weekly job already re-checks maintenance status for everything indexed.
#
# Snapshots are committed to data/history/ so the series accumulates.

on:
  schedule:
    - cron: "0 7 1 * *"        # 1st of the month, 07:00 UTC
  workflow_dispatch:
    inputs:
      min_stars:
        description: "Star floor"
        default: "50"
      recent_stars:
        description: "Star floor for repos created in the last 90 days"
        default: "10"
      since:
        description: "First year of creation dates"
        default: "2015"
      owner_cap:
        description: "Max repos kept per owner"
        default: "10"

permissions:
  contents: write

concurrency:
  group: harvest-github
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set date
        run: echo "STAMP=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Harvest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/history
          python scripts/harvest_gh.py \
            --min-stars "${{ github.event.inputs.min_stars || '50' }}" \
            --recent-stars "${{ github.event.inputs.recent_stars || '10' }}" \
            --since "${{ github.event.inputs.since || '2015' }}" \
            --owner-cap "${{ github.event.inputs.owner_cap || '10' }}" \
            --out "data/history/gh-${STAMP}.csv" \
            | tee /tmp/gh.log

      - name: Compare with the previous snapshot
        run: |
          python - <<'EOF' | tee /tmp/ghdiff.log
          import csv, glob, os
          snaps = sorted(glob.glob("data/history/gh-*.csv"))
          if len(snaps) < 2:
              print("First GitHub snapshot — nothing to compare against yet.")
              raise SystemExit
          prev, cur = snaps[-2], snaps[-1]
          load = lambda p: {r["repo"]: r for r in csv.DictReader(open(p, encoding="utf-8"))}
          a, b = load(prev), load(cur)
          print(f"{os.path.basename(prev)} -> {os.path.basename(cur)}")
          print(f"  {len(a)} -> {len(b)} repos\n")

          new = [k for k in b if k not in a]
          print(f"NEW ({len(new)})")
          for k in sorted(new, key=lambda k: -int(b[k]["stars"]))[:25]:
              print(f"  {int(b[k]['stars']):>7,}*  {b[k]['license'] or '-':<14} {k}")

          # A repo going inactive is the change worth reporting. Stars drift;
          # maintenance stopping is a decision someone made.
          moved = [(k, a[k]["status"], b[k]["status"]) for k in set(a) & set(b)
                   if a[k]["status"] != b[k]["status"]]
          worse = [m for m in moved if m[2] in ("inactive", "archived")]
          better = [m for m in moved if m[1] in ("inactive", "archived") and m[2] == "active"]
          print(f"\nWENT INACTIVE OR ARCHIVED ({len(worse)})")
          for k, x, y in worse:
              print(f"  {x} -> {y}  {int(b[k]['stars']):>7,}*  {k}")
          print(f"\nCAME BACK TO LIFE ({len(better)})")
          for k, x, y in better:
              print(f"  {x} -> {y}  {k}")

          drift = [(k, a[k]["license"] or "-", b[k]["license"] or "-")
                   for k in set(a) & set(b)
                   if (a[k]["license"] or "") != (b[k]["license"] or "")]
          print(f"\nLICENCE CHANGED ({len(drift)})")
          for k, x, y in drift:
              print(f"  {k}: {x} -> {y}")

          gains = sorted(((int(b[k]["stars"]) - int(a[k]["stars"]), k)
                          for k in set(a) & set(b)), reverse=True)
          print(f"\nBIGGEST STAR GAINS")
          for d, k in gains[:15]:
              if d <= 0:
                  break
              print(f"  +{d:>6,}  {int(b[k]['stars']):>7,}*  {k}")
          EOF

      - name: Commit the snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history/
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "GitHub harvest snapshot ${STAMP}"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gh-harvest-${{ env.STAMP }}
          path: |
            data/history/gh-${{ env.STAMP }}.csv
            /tmp/gh.log
            /tmp/ghdiff.log

      - name: Summary
        run: |
          {
            echo "## Month-on-month change"
            echo '```'; cat /tmp/ghdiff.log; echo '```'
            echo "## Harvest"
            echo '```'; cat /tmp/gh.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
