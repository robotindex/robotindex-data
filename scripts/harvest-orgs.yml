name: Harvest orgs

# Weekly sweep of every organisation we watch, listing what they have published
# recently regardless of stars or topic tags.
#
# This exists because the topic search in harvest-github.yml is structurally
# late. A repository earns stars only after people find it, and many never set
# a topic at all, so anything published in the last few weeks is invisible to a
# search with a 50-star floor. Pantheon's Argus annotator went up on 1 October
# 2026, audited nine of the largest open robotics datasets, and was missed by a
# harvest run on 3 October for exactly that reason.
#
# Listing an organisation's repositories is one call with no floor and no topic
# requirement, so a watched org's work appears the day it is published. A few
# hundred calls against a 5,000/hour limit — cheap enough to run weekly, unlike
# the monthly topic search which makes over four thousand.
#
# Output is only what is NOT already in data/history, so this produces a short
# review list rather than another census.

on:
  schedule:
    - cron: "0 8 * * 2"        # Tuesdays, 08:00 UTC — the day after the HF harvest
  workflow_dispatch:
    inputs:
      since:
        description: "Only repos created on or after this date (blank = last 90 days)"
        default: ""
      derive:
        description: "Regenerate the watch list from the latest harvest first"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: harvest-orgs
  cancel-in-progress: false

jobs:
  orgs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set date
        run: echo "STAMP=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Regenerate the watch list
        if: ${{ github.event.inputs.derive == 'true' }}
        run: |
          LATEST=$(ls -1 data/history/gh-*.csv | tail -1)
          echo "deriving from $LATEST"
          python scripts/harvest_orgs.py --derive "$LATEST"

      - name: Sweep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/history
          python scripts/harvest_orgs.py \
            ${{ github.event.inputs.since && format('--since {0}', github.event.inputs.since) || '' }} \
            --out "data/history/orgs-${STAMP}.csv" \
            | tee /tmp/orgs.log

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history/ data/watched-orgs.json
          if git diff --staged --quiet; then
            echo "Nothing new."
          else
            git commit -m "Org sweep ${STAMP}"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: orgs-${{ env.STAMP }}
          path: |
            data/history/orgs-${{ env.STAMP }}.csv
            /tmp/orgs.log

      - name: Summary
        run: |
          {
            echo "## New from watched organisations"
            echo '```'; cat /tmp/orgs.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
